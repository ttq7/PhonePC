org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true
# the native file watcher cannot run inside the confined sandbox
org.gradle.vfs.watch=false

android.useAndroidX=true
android.nonTransitiveRClass=true
# the project lives under E:\此电脑 (non-ASCII); AGP's path check is advisory only
android.overridePathCheck=true
android.suppressUnsupportedCompileSdk=36

kotlin.code.style=official
# Gradle escapes non-ASCII characters when it serialises compiler arguments
# to the Kotlin worker, which breaks source paths under E:\此电脑.
# Running the compiler inside the Gradle daemon avoids that round trip.
kotlin.compiler.execution.strategy=in-process
