org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true
# the native file watcher cannot run inside the confined sandbox
org.gradle.vfs.watch=false

android.useAndroidX=true
android.nonTransitiveRClass=true
# AGP refuses project paths containing non-ASCII characters. This is only a
# check, not a real limitation, so override it. See README "构建".
android.overridePathCheck=true
android.suppressUnsupportedCompileSdk=36

kotlin.code.style=official
# Gradle escapes non-ASCII characters when it serialises compiler arguments
# to the Kotlin worker, which then cannot find source files whose path
# contains non-ASCII characters. Compile in-process instead.
# Running the compiler inside the Gradle daemon avoids that round trip.
kotlin.compiler.execution.strategy=in-process
